name: Build & Publish Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores & Environment (.env)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              printf "APINEX_API_KEY=PLACEHOLDER_APINEX_API_KEY\nGITHUB_PAT_TOKEN=PLACEHOLDER_GITHUB_PAT_TOKEN\n" > .env
            fi
          fi
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore ~/.android/debug.keystore || true
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android123 \
              -alias upload \
              -keypass android123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NexCode Studio,OU=Mobile,O=NexCode,L=Yangon,S=Yangon,C=MM"
          fi

      - name: Build Signed Release & Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          gradle --version
          if ! gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace; then
            echo "Retrying with standard SDK 36 configuration if minorApiLevel SDK is unavailable on runner..."
            if [ -f "app/build.gradle.kts" ]; then
              sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts || true
            fi
            gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace || gradle assembleDebug -x lint -x test --no-daemon --stacktrace
          fi
          mkdir -p release-apks
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "release-apks/NexSampleApp-release.apk" \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} "release-apks/NexSampleApp-debug.apk" \;
          if [ ! -f "release-apks/NexSampleApp-release.apk" ] && [ -f "release-apks/NexSampleApp-debug.apk" ]; then
            cp "release-apks/NexSampleApp-debug.apk" "release-apks/NexSampleApp-release.apk"
          fi
          ls -lh release-apks/

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexSampleApp-APKs
          path: release-apks/*.apk

      - name: Publish APK Directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NexSampleApp APK Release v1.0.${{ github.run_number }}"
          body: |
            ## 📱 NexSampleApp — Direct Android APK Release
            Built automatically via GitHub Actions (Gradle 9.3.1 + JDK 21) from commit `${{ github.sha }}`.

            ### 📥 Direct APK Downloads (Assets below):
            - **`NexSampleApp-release.apk`** — Signed Release APK (Recommended for installation)
            - **`NexSampleApp-debug.apk`** — Debug APK
          files: |
            release-apks/NexSampleApp-release.apk
            release-apks/NexSampleApp-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
